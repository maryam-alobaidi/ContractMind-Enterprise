<div class="glass-container">
<!-- القائمة الجانبية -->
<aside class="glass-sidebar">
 <div class="glass-brand ">
    <img src="favicon.svg" title="ContractMind Logo" alt="ContractMind Logo" width="75" height="75">
    <h2>Contract<span>Mind</span></h2>
   </div>
<nav class="glass-nav">

  <a routerLink="/contracts-archive" routerLinkActive="active" class="nav-item">Contracts Archive</a>
  <a routerLink="/ai-legal-assistant" routerLinkActive="active" class="nav-item">AI Legal Assistant</a>
  <a routerLink="/audit-logs" routerLinkActive="active" class="nav-item">Audit Logs</a>
</nav>
 <div class="glass-user">
    <div class="user-avatar-glass">👩‍⚖️</div>
    <div class="user-meta-glass">
      <h4>{{userName()}}</h4>
      <span>Senior Legal Counsel</span>
    </div>
 </div>
</aside>

<main class="glass-main">
 <header class="glass-header">
  
    <div class="header-controls-glass">
      
      <button class="btn-theme-toggle" (click)="toggleTheme()">
     <span class="icon">{{ themeService.isDarkMode() ? '☀️' : '🌙' }}</span> 
       {{ themeService.isDarkMode() ? 'Light' : 'Dark' }}
      </button>
     
      <div class="lang-switch-glass">
  <button 
    class="lang-pill" 
    [class.active]="languageService.currentLanguage() === 'en'" 
    (click)="languageService.setLanguage('en')">EN</button>
    
  <button 
    class="lang-pill" 
    [class.active]="languageService.currentLanguage() === 'es'" 
    (click)="languageService.setLanguage('es')">ES</button>
    
  <button 
    class="lang-pill" 
    [class.active]="languageService.currentLanguage() === 'ar'" 
    (click)="languageService.setLanguage('ar')">AR</button>
</div>
           <button class="btn-teal-glow" (click)="onUploadClick()">
          <span>+</span> Upload New Contract
        </button>  
    </div>
</header>

<router-outlet></router-outlet>
</main>
</div>


@if (showUploadModal()) {
  <app-upload-modal 
    (close)="showUploadModal.set(false)" 
    (uploadSuccess)="handleUploadSuccess($event)">
  </app-upload-modal>
}
