<div class="modal-backdrop" (click)="!isUploading() && closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <!-- رأس النافذة -->
    <div class="modal-header">
      <h3>Upload New Contract</h3>
      <!-- تعطيل زر الإغلاق أثناء عملية الرفع والتحليل -->
      <button class="btn-close" [disabled]="isUploading()" (click)="closeModal()">×</button>
    </div>

    <!-- 🌍 اختيار لغة الذكاء الاصطناعي -->
    <div class="lang-container mb-4">
      <label class="lang-label">AI Summary Language</label>
      <div class="lang-switch-glass">
        <button type="button" class="lang-pill" [class.active]="selectedLanguage() === 'en'" (click)="selectedLanguage.set('en')">EN</button>
        <button type="button" class="lang-pill" [class.active]="selectedLanguage() === 'es'" (click)="selectedLanguage.set('es')">ES</button>
        <button type="button" class="lang-pill" [class.active]="selectedLanguage() === 'ar'" (click)="selectedLanguage.set('ar')">AR</button>
      </div>
    </div>

    <!-- منطقة سحب وإفلات الملفات -->
    <div class="upload-dropzone mb-4">
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,.docx" id="fileInput" hidden [disabled]="isUploading()" />
      <label for="fileInput" class="dropzone-label">
        @if (selectedFile()) {
          <span class="file-name">📄 {{ selectedFile()?.name }}</span>
        } @else {
          <span>Drag & drop contract here or <strong>Browse</strong></span>
          <small>Supports PDF, DOCX (Max 25MB)</small>
        }
      </label>
    </div>

    <!-- عرض رسالة الخطأ إن وجدت -->
    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
        {{ errorMessage() }}
      </div>
    }

    <!-- شريط التقدم أثناء الرفع والتحليل -->
   @if (isUploading()) {
  <div class="progress-container mb-4 text-center">
    <div class="spinner-border text-emerald-600 mb-2" role="status" style="width: 2rem; height: 2rem;"></div>
    <p class="text-sm font-semibold text-gray-700">Processing and reading document (OCR) in the background...</p>
    <small class="text-xs text-gray-500 mt-1 block">Please wait and do not close the page until the upload is complete.</small>
  </div>
}

    <!-- أزرار التحكم -->
    <div class="modal-actions flex justify-end gap-2 pt-3 border-t">
      <button class="btn-cancel px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-50 transition-colors" 
              [disabled]="isUploading()" 
              (click)="closeModal()">
        Cancel
      </button>
      
      <button class="btn-submit px-5 py-2 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 disabled:opacity-50 transition-all shadow-sm" 
        [disabled]="!selectedFile() || isUploading()" 
        (click)="$event.stopPropagation(); onUpload()"
        type="button">
       {{ isUploading() ? 'Processing OCR...' : 'Upload & Analyze' }}
     </button>
    </div>

  </div>
</div>
