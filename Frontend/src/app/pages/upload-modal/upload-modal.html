<div class="modal-backdrop">
  <div class="modal-card">
    
    <!-- رأس النافذة -->
    <div class="modal-header">
      <h3>Upload New Contract</h3>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>

    <!-- 🌍 اختيار لغة الذكاء الاصطناعي (أقصى اليمين بتصميم منسق) -->
    <div class="lang-container mb-4">
      <label class="lang-label">
        AI Summary Language
      </label>
      
      <div class="lang-switch-glass">
        <button type="button"
                class="lang-pill" 
                [class.active]="selectedLanguage() === 'en'" 
                (click)="selectedLanguage.set('en')">
          EN
        </button>
        
        <button type="button"
                class="lang-pill" 
                [class.active]="selectedLanguage() === 'es'" 
                (click)="selectedLanguage.set('es')">
          ES
        </button>
        
        <button type="button"
                class="lang-pill" 
                [class.active]="selectedLanguage() === 'ar'" 
                (click)="selectedLanguage.set('ar')">
          AR
        </button>
      </div>
    </div>

    <!-- منطقة سحب وإفلات الملفات -->
    <div class="upload-dropzone mb-4">
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,.docx" id="fileInput" hidden />
      <label for="fileInput" class="dropzone-label">
        @if (selectedFile()) {
          <span class="file-name">📄 {{ selectedFile()?.name }}</span>
        } @else {
          <span>Drag & drop contract here or <strong>Browse</strong></span>
          <small>Supports PDF, DOCX (Max 25MB)</small>
        }
      </label>
    </div>

    <!-- شريط التقدم أثناء الرفع والتحليل -->
    @if (isUploading()) {
      <div class="progress-container mb-4">
        <div class="progress-bar" [style.width.%]="uploadProgress()"></div>
        <span class="text-xs text-gray-500 mt-1 block text-center">AI Analyzing Contract... {{ uploadProgress() }}%</span>
      </div>
    }

    <!-- أزرار التحكم -->
    <div class="modal-actions flex justify-end gap-2 pt-3 border-t">
      <button class="btn-cancel px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-50 transition-colors" (click)="closeModal()">Cancel</button>
      <button class="btn-submit px-5 py-2 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 disabled:opacity-50 transition-all shadow-sm" 
              [disabled]="!selectedFile() || isUploading()" 
              (click)="onUpload()">
        {{ isUploading() ? 'Analyzing...' : 'Upload & Analyze' }}
      </button>
    </div>

  </div>
</div>
