<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ContractMind</title>
  <defs>
    <!-- Brand gradient: violet to cyan -->
    <linearGradient id="cm-accent" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- Soft violet light in the top-left of the tile -->
    <radialGradient id="cm-glow" cx="18" cy="12" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="15" fill="#0D0F16"/>
  <rect width="64" height="64" rx="15" fill="url(#cm-glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#cm-accent)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Contract: a page with a folded corner -->
  <path d="M19 11.5h16.5l9.5 9.5v28.5a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3v-35a3 3 0 0 1 3-3z"
        fill="#161A26" stroke="url(#cm-accent)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M35.5 11.5v7a2.5 2.5 0 0 0 2.5 2.5h7" fill="none" stroke="url(#cm-accent)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Clauses -->
  <path d="M22.5 29h15M22.5 36h10" stroke="#C9CDDB" stroke-width="3" stroke-linecap="round"/>

  <!-- AI review: a four-point sparkle, cut out from the page with a dark outline -->
  <path d="M45 34c1.1 5.6 3.4 7.9 9 9-5.6 1.1-7.9 3.4-9 9-1.1-5.6-3.4-7.9-9-9 5.6-1.1 7.9-3.4 9-9z"
        fill="url(#cm-accent)" stroke="#0D0F16" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
</svg>
